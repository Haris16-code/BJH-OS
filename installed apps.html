<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJH OS Launcher</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind & Lucide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'zoom-in': 'zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        zoomIn: { '0%': { transform: 'scale(0.9) opacity(0)' }, '100%': { transform: 'scale(1) opacity(1)' } },
                        slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
        }
        .dark {
            --glass: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s; overflow: hidden; }
        
        /* Premium Wallpaper */
        .wallpaper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=2574&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            z-index: -1;
            transition: filter 0.3s;
        }
        .dark .wallpaper { filter: brightness(0.6); }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }
        
        .app-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .dark .app-card {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .app-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.95);
        }
        .dark .app-card:hover {
            background: rgba(30, 41, 59, 0.9);
        }

        /* Custom CSS Loader (Best Visuals) */
        .os-loader {
            width: 64px;
            height: 64px;
            position: relative;
        }
        .os-loader:before, .os-loader:after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #3b82f6;
            border-bottom-color: #3b82f6;
            width: 100%;
            height: 100%;
            animation: spin 1.5s linear infinite;
        }
        .os-loader:after {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-top-color: #8b5cf6;
            border-bottom-color: #8b5cf6;
            animation: spin 2s linear infinite reverse;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }
        
        *:focus { outline: none !important; }
    </style>
</head>
<body class="text-slate-900 dark:text-white">

<div class="wallpaper"></div>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    
    const API_URL = 'https://bjhos.unaux.com/Apps-Market/api.php';
    // REPLACED PHP TAGS WITH DEFAULTS FOR PURE HTML FILE
    const INITIAL_LOGGED_IN = false; // Will be updated by useEffect fetch
    const USER_NAME = "User"; // Will be updated on login
    const FALLBACK_ICON = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48cmVjdCB3aWR0aD0iODAiIGhlaWdodD0iODAiIGZpbGw9IiNmZmZmZmYiIHJ4PSIxOCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMHB4IiBmaWxsPSIjY2NjIj5BUFA8L3RleHQ+PC9zdmc+";

    const Icon = ({ name, size = 20, className }) => {
        useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, [name]);
        return <i data-lucide={name} className={className} style={{width:size, height:size, display:'inline-block'}}></i>;
    };

    // --- APP VIEWER (New Feature) ---
    const AppViewer = ({ app, onClose }) => {
        const [loading, setLoading] = useState(true);

        return (
            <div className="fixed inset-0 z-[100] bg-white dark:bg-[#0f172a] flex flex-col animate-zoom-in">
                
                {/* Custom OS Bar */}
                <div className="h-12 border-b border-slate-200 dark:border-white/10 flex items-center justify-between px-4 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-20">
                    <div className="flex items-center gap-3">
                        <button 
                            onClick={onClose}
                            className="p-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30 text-red-500 transition-colors"
                            title="Close App"
                        >
                            <Icon name="x" size={20} />
                        </button>
                        <div className="flex items-center gap-2 px-2 border-l border-slate-200 dark:border-white/10 pl-3">
                             <img src={app.icon_url} className="w-5 h-5 rounded shadow-sm" onError={(e) => e.target.src = FALLBACK_ICON}/>
                            <h2 className="font-semibold text-sm text-slate-800 dark:text-white">
                                {app.name}
                            </h2>
                        </div>
                    </div>
                    
                    <div className="flex items-center gap-3">
                        {loading && (
                            <div className="flex items-center gap-2 text-xs text-blue-500 font-medium mr-2">
                                <span className="animate-pulse">Loading...</span>
                            </div>
                        )}
                        <a 
                            href={app.live_url} 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5 text-slate-400 dark:text-slate-500 transition-colors"
                            title="Open in New Tab"
                        >
                            <Icon name="external-link" size={16} />
                        </a>
                    </div>
                </div>

                {/* App Content */}
                <div className="flex-1 relative w-full h-full bg-white">
                    
                    {/* Smart Loading Screen */}
                    <div 
                        className={`absolute inset-0 flex flex-col items-center justify-center z-10 bg-white/80 dark:bg-slate-900/90 backdrop-blur-xl transition-opacity duration-700 ${loading ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}
                    >
                        <div className="relative mb-8">
                            <img 
                                src={app.icon_url} 
                                className="w-24 h-24 rounded-[24px] shadow-2xl animate-pulse-slow relative z-10" 
                                onError={(e) => e.target.src = FALLBACK_ICON} 
                            />
                            <div className="absolute inset-0 bg-blue-500/30 blur-2xl rounded-full"></div>
                        </div>
                        
                        <div className="os-loader mb-4"></div>
                        
                        <h3 className="text-2xl font-bold text-slate-800 dark:text-white mb-1">Starting {app.name}</h3>
                        <p className="text-slate-500 dark:text-slate-400 text-sm">Initializing environment...</p>
                    </div>

                    <iframe 
                        src={app.live_url}
                        title={app.name}
                        className="w-full h-full border-0"
                        style={{ backgroundColor: '#ffffff' }}
                        allowFullScreen
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        // The onLoad here is key - it turns off the loading screen when the app is ready
                        onLoad={() => setTimeout(() => setLoading(false), 1000)} 
                    />
                </div>
            </div>
        );
    };

    // --- LOGIN SCREEN COMPONENT ---
    const LoginScreen = ({ onLoginSuccess }) => {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [loading, setLoading] = useState(false);

        const handleLogin = async (e) => {
            e.preventDefault();
            setLoading(true);
            const fd = new FormData();
            fd.append('action', 'login');
            fd.append('email', email);
            fd.append('password', password);

            try {
                const res = await fetch(API_URL, { method: 'POST', body: fd });
                const data = await res.json();
                if (data.status === 'success') {
                    onLoginSuccess(data.user_name || 'User');
                } else {
                    Swal.fire('Login Failed', data.message, 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Connection failed.', 'error');
            } finally {
                setLoading(false);
            }
        };

        return (
            <div className="fixed inset-0 flex items-center justify-center z-50 animate-zoom-in p-4">
                <div className="glass-panel p-8 rounded-[32px] w-full max-w-md text-center shadow-2xl border border-white/40 relative overflow-hidden">
                    
                    <div className="mb-8">
                        <div className="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner backdrop-blur-md border border-white/20">
                            <Icon name="lock" size={32} className="text-white" />
                        </div>
                        <h2 className="text-3xl font-bold mb-2 text-slate-800 dark:text-white tracking-tight">Welcome Back</h2>
                        <p className="text-slate-600 dark:text-slate-300">Sign in to BJH OS</p>
                    </div>

                    <form onSubmit={handleLogin} className="space-y-4">
                        <div className="relative group">
                            <Icon name="mail" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors"/>
                            <input 
                                type="email" 
                                placeholder="Email Address" 
                                className="w-full bg-white/60 dark:bg-slate-800/60 border border-white/50 dark:border-slate-600 rounded-2xl py-3.5 pl-11 pr-4 focus:ring-2 focus:ring-blue-500/50 transition-all outline-none placeholder:text-slate-400"
                                value={email}
                                onChange={e => setEmail(e.target.value)}
                                required
                            />
                        </div>
                        <div className="relative group">
                            <Icon name="key" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors"/>
                            <input 
                                type="password" 
                                placeholder="Password" 
                                className="w-full bg-white/60 dark:bg-slate-800/60 border border-white/50 dark:border-slate-600 rounded-2xl py-3.5 pl-11 pr-4 focus:ring-2 focus:ring-blue-500/50 transition-all outline-none placeholder:text-slate-400"
                                value={password}
                                onChange={e => setPassword(e.target.value)}
                                required
                            />
                        </div>
                        
                        <button 
                            type="submit" 
                            disabled={loading}
                            className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-2xl font-bold shadow-xl shadow-blue-500/20 transition-all hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed mt-4"
                        >
                            {loading ? 'Authenticating...' : 'Login'} <Icon name="arrow-right" size={18}/>
                        </button>
                    </form>

                    <div className="mt-8 pt-6 border-t border-slate-200/30 dark:border-white/10">
                        <a href="https://bjhos.unaux.com/Apps-Market/index.php" className="text-sm text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 font-semibold transition-colors">Create New Account</a>
                    </div>
                </div>
            </div>
        );
    };

    // --- LAUNCHER APP ---
    const Launcher = () => {
        const [isLoggedIn, setIsLoggedIn] = useState(INITIAL_LOGGED_IN);
        const [userName, setUserName] = useState(USER_NAME);
        const [apps, setApps] = useState([]);
        const [loading, setLoading] = useState(true);
        const [activeApp, setActiveApp] = useState(null); // Tracks which app is open
        
        const [theme, setTheme] = useState(() => localStorage.getItem('bjh_theme') || 'light');

        useEffect(() => {
            document.documentElement.classList.toggle('dark', theme === 'dark');
            localStorage.setItem('bjh_theme', theme);
        }, [theme]);

        const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');

        const fetchLibrary = useCallback(() => {
            setLoading(true);
            const fd = new FormData();
            fd.append('action', 'fetch_user_library');
            
            fetch(API_URL, { method: 'POST', body: fd })
            .then(r => r.text()) 
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    if(data.status === 'success') {
                        setApps(data.projects);
                        setIsLoggedIn(true);
                    } else {
                        setIsLoggedIn(false);
                    }
                } catch(e) {
                    // Silent fail, likely not logged in or network issue
                    setIsLoggedIn(false);
                }
            })
            .catch(() => setIsLoggedIn(false))
            .finally(() => setLoading(false));
        }, []);

        useEffect(() => {
            // Always attempt to fetch library on load to check session
            fetchLibrary();
        }, [fetchLibrary]);

        const handleLaunch = (app) => {
            // Instead of redirecting, set activeApp to trigger AppViewer
            setActiveApp(app);
        };
        
        const handleLogout = () => { window.location.href = 'https://bjhos.unaux.com/Apps-Market/logout.php'; };
        const handleLoginSuccess = (name) => { setUserName(name); fetchLibrary(); };

        // --- VIEW RENDERING ---

        if (activeApp) {
            return <AppViewer app={activeApp} onClose={() => setActiveApp(null)} />;
        }

        if (!loading && !isLoggedIn) {
            return <LoginScreen onLoginSuccess={handleLoginSuccess} />;
        }
        
        if (loading) {
             return (
                 <div className="fixed inset-0 flex items-center justify-center z-50">
                    <div className="text-white text-center">
                        <div className="os-loader mb-4 mx-auto"></div>
                        <p className="text-lg font-medium animate-pulse drop-shadow-md">Opening Installed Apps...</p>
                    </div>
                 </div>
             );
        }

        return (
            <div className="min-h-screen flex flex-col p-4 md:p-8 animate-fade-in">
                
                {/* Header */}
                <header className="glass-panel rounded-2xl p-4 flex justify-between items-center mb-8 sticky top-4 z-50">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-md shadow-inner border border-white/30">
                            <Icon name="layout-grid" size={24} className="text-slate-800 dark:text-white" />
                        </div>
                        <div>
                            <h1 className="font-bold text-lg text-slate-800 dark:text-white leading-tight">BJH Launcher</h1>
                            <p className="text-xs font-medium text-slate-500 dark:text-slate-300">Welcome, {userName}</p>
                        </div>
                    </div>
                    
                    <div className="flex items-center gap-2">
                         <a href="https://bjhos.unaux.com/Apps-Market/store.php" className="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-white/50 dark:bg-black/20 hover:bg-white/80 dark:hover:bg-black/40 transition-colors text-sm font-bold text-slate-700 dark:text-white border border-white/10 shadow-sm">
                            <Icon name="shopping-bag" size={16} /> Store
                        </a>
                        <button onClick={toggleTheme} className="p-2.5 rounded-xl bg-white/50 dark:bg-black/20 hover:bg-white/80 dark:hover:bg-black/40 transition-colors text-slate-700 dark:text-white">
                            {theme === 'light' ? <Icon name="moon" size={18} /> : <Icon name="sun" size={18} />}
                        </button>
                        <button onClick={handleLogout} className="p-2.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 transition-colors">
                            <Icon name="log-out" size={18} />
                        </button>
                    </div>
                </header>

                {/* App Grid */}
                <main className="flex-grow">
                    {apps.length > 0 ? (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
                            {apps.map((app, idx) => (
                                <div 
                                    key={app.id} 
                                    className="group relative flex flex-col items-center justify-center p-4 rounded-2xl app-card cursor-pointer h-44 animate-zoom-in"
                                    style={{animationDelay: `${idx * 50}ms`}}
                                    onClick={() => handleLaunch(app)}
                                >
                                    <div className="w-20 h-20 rounded-[22px] shadow-lg transition-transform duration-300 group-hover:scale-110 group-hover:-translate-y-3 bg-white dark:bg-slate-800 relative z-10 overflow-hidden border border-slate-100 dark:border-slate-700">
                                        <img 
                                            src={app.icon_url} 
                                            alt={app.name} 
                                            className="w-full h-full object-cover" 
                                            onError={(e) => e.target.src = FALLBACK_ICON} 
                                        />
                                    </div>
                                    
                                    <div className="relative h-8 w-full flex items-center justify-center overflow-visible mt-3">
                                        <span className="absolute top-0 text-sm font-bold text-slate-800 dark:text-white drop-shadow-sm truncate w-full text-center transition-all duration-300 group-hover:opacity-0 group-hover:translate-y-2 px-2">
                                            {app.name}
                                        </span>
                                        <div className="absolute top-0 transition-all duration-300 opacity-0 -translate-y-2 group-hover:translate-y-0 group-hover:opacity-100">
                                            <span className="bg-blue-600 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-lg flex items-center gap-1">
                                                OPEN
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="h-[60vh] flex flex-col items-center justify-center text-center animate-fade-in">
                            <div className="w-24 h-24 glass-panel rounded-full flex items-center justify-center mb-6 text-slate-400 dark:text-white/50 bg-white/30 dark:bg-black/30">
                                <Icon name="package-open" size={48} />
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 dark:text-white mb-2">Your library is empty</h2>
                            <p className="text-slate-600 dark:text-white/70 max-w-xs mb-6">Looks like you haven't installed any apps yet. Visit the store to get started.</p>
                            <a href="https://bjhos.unaux.com/Apps-Market/store.php" className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition-all flex items-center gap-2 shadow-lg shadow-blue-500/30">
                                <Icon name="shopping-bag" size={18} /> Browse Store
                            </a>
                        </div>
                    )}
                </main>

            </div>
        );
    };

    function initIcons() {
        if(window.lucide) window.lucide.createIcons();
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Launcher />);
    
    setTimeout(initIcons, 100);
</script>
</body>
</html>
