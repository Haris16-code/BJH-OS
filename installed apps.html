<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJH OS Installed Apps</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS with Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(226, 232, 240, 0.8);
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: rgba(226, 232, 240, 0.6);
            --card-hover-bg: rgba(255, 255, 255, 0.9);
            --card-hover-border: rgba(59, 130, 246, 0.3);
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        .dark {
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.05);
            --card-hover-bg: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(255, 255, 255, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-up {
            animation: fadeUp 0.5s ease-out forwards;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            transition: background 0.3s, border-color 0.3s;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: var(--card-hover-bg);
            border-color: var(--card-hover-border);
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.05);
        }
        .dark .glass-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0f172a] dark:text-f8fafc">

<div id="root"></div>

<script type="text/babel">

    const { useState, useEffect, useMemo, useRef } = React;

    // --- Components ---

    const Icon = ({ name, size = 24, className }) => {
        useEffect(() => {
            lucide.createIcons();
        }, [name]);
        return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
    };

    const ThemeToggle = ({ theme, toggleTheme }) => (
        <button 
            onClick={toggleTheme}
            className="p-2.5 rounded-xl bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 transition-all shadow-sm"
            aria-label="Toggle Theme"
        >
            {theme === 'light' ? (
                <Icon name="moon" size={20} />
            ) : (
                <Icon name="sun" size={20} />
            )}
        </button>
    );

    const AppCard = ({ app, delay }) => {
        const [imgError, setImgError] = useState(false);

        return (
            <div 
                className="glass-card rounded-2xl p-6 flex flex-col items-center text-center relative overflow-hidden group animate-fade-up"
                style={{ animationDelay: `${delay}ms` }}
            >
                {/* Decorative Glow */}
                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

                <div className="relative mb-4">
                    <div className="w-20 h-20 rounded-2xl overflow-hidden bg-slate-200 dark:bg-slate-800 shadow-md ring-2 ring-slate-100 dark:ring-white/10 group-hover:ring-blue-400/50 transition-all duration-300">
                        {!imgError && app.app_icon ? (
                            <img 
                                src={app.app_icon} 
                                alt={app.app_name} 
                                className="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                                onError={() => setImgError(true)}
                            />
                        ) : (
                            <div className="w-full h-full flex items-center justify-center bg-gradient-to-br from-slate-200 to-slate-300 dark:from-slate-700 dark:to-slate-800">
                                <Icon name="box" size={32} className="text-slate-400" />
                            </div>
                        )}
                    </div>
                </div>

                <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-1 line-clamp-1 group-hover:text-blue-600 dark:group-hover:text-blue-300 transition-colors">
                    {app.app_name || 'Unknown App'}
                </h3>
                
                <div className="flex items-center gap-1.5 mb-5 px-3 py-1 rounded-full bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/5">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 dark:bg-emerald-400 animate-pulse"></span>
                    <p className="text-xs text-slate-500 dark:text-slate-400 font-mono">v{app.version_downloaded}</p>
                </div>

                <div className="mt-auto w-full">
                    {app.live_url && app.live_url.trim() !== '' ? (
                        <a 
                            href={app.live_url} 
                            className="flex items-center justify-center gap-2 w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-500/20 dark:shadow-blue-900/20 transition-all duration-200 active:scale-95 group-hover:shadow-blue-500/30"
                        >
                            <span>Open App</span>
                            <Icon name="external-link" size={14} />
                        </a>
                    ) : (
                        <button disabled className="w-full py-2.5 px-4 bg-slate-200 dark:bg-slate-700/50 text-slate-400 dark:text-slate-500 text-sm font-medium rounded-xl cursor-not-allowed border border-transparent dark:border-white/5">
                            Not Available
                        </button>
                    )}
                </div>
            </div>
        );
    };

    const LoadingSkeleton = () => (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full">
            {[1, 2, 3, 4].map((i) => (
                <div key={i} className="glass-card rounded-2xl p-6 h-64 flex flex-col items-center justify-between animate-pulse">
                    <div className="w-20 h-20 bg-slate-200 dark:bg-slate-700 rounded-2xl"></div>
                    <div className="h-4 w-32 bg-slate-200 dark:bg-slate-700 rounded full mt-4"></div>
                    <div className="h-3 w-16 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
                    <div className="h-10 w-full bg-slate-200 dark:bg-slate-700 rounded-xl mt-4"></div>
                </div>
            ))}
        </div>
    );

    const EmptyState = ({ message, icon = "package-open" }) => (
        <div className="flex flex-col items-center justify-center py-20 text-center animate-fade-up">
            <div className="w-24 h-24 rounded-full bg-slate-100 dark:bg-slate-800/50 flex items-center justify-center mb-6 ring-1 ring-slate-200 dark:ring-white/10">
                <Icon name={icon} size={40} className="text-slate-400 dark:text-slate-500" />
            </div>
            <h3 className="text-xl font-semibold text-slate-800 dark:text-white mb-2">It's quiet here...</h3>
            <p className="text-slate-500 dark:text-slate-400 max-w-md">{message}</p>
        </div>
    );

    const Header = ({ email, count, onSearch, theme, toggleTheme }) => {
        return (
            <div className="sticky top-0 z-50 glass-panel border-b mb-8">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        
                        {/* Logo / Title */}
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-blue-600 rounded-lg shadow-lg shadow-blue-500/20">
                                <Icon name="layout-grid" size={24} className="text-white" />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-slate-900 dark:text-white tracking-tight">BJH OS Installed Apps</h1>
                                <p className="text-xs text-slate-500 dark:text-blue-300 font-medium">{count} Installed Apps</p>
                            </div>
                        </div>

                        {/* Search & Theme Toggle Only */}
                        <div className="flex items-center gap-4 w-full md:w-auto">
                            <div className="relative flex-1 md:w-64">
                                <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                <input 
                                    type="text" 
                                    placeholder="Search apps..." 
                                    onChange={(e) => onSearch(e.target.value)}
                                    className="w-full bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500"
                                />
                            </div>

                            <ThemeToggle theme={theme} toggleTheme={toggleTheme} />
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const ManualLogin = ({ onLogin }) => {
        const [inputEmail, setInputEmail] = useState('');
        
        return (
             <div className="mt-6 pt-6 border-t border-slate-200 dark:border-white/10 w-full animate-fade-up">
                <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">Can't detect login? Enter email manually:</p>
                <div className="flex gap-2">
                    <input 
                        type="email" 
                        placeholder="Enter BJH OS Email"
                        value={inputEmail}
                        onChange={(e) => setInputEmail(e.target.value)}
                        className="flex-1 bg-white dark:bg-slate-800 border border-slate-300 dark:border-white/20 text-slate-900 dark:text-white text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 transition-colors"
                    />
                    <button 
                        onClick={() => onLogin(inputEmail)}
                        className="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors"
                    >
                        Save
                    </button>
                </div>
            </div>
        )
    }

    const MainApp = () => {
        const [apps, setApps] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [search, setSearch] = useState('');
        const [userEmail, setUserEmail] = useState('');
        
        // Load theme from localStorage or default to 'light'
        const [theme, setTheme] = useState(() => {
            return localStorage.getItem('bjh_os_theme') || 'light';
        });

        // Handle Theme Change and Persistence
        useEffect(() => {
            const root = document.documentElement;
            if (theme === 'dark') {
                root.classList.add('dark');
            } else {
                root.classList.remove('dark');
            }
            localStorage.setItem('bjh_os_theme', theme);
        }, [theme]);

        const toggleTheme = () => {
            setTheme(prev => prev === 'light' ? 'dark' : 'light');
        };

        const attemptGetUserEmail = () => {
             let email = null;
            
            // 1. Local Storage (Iframe Scope)
            try { email = localStorage.getItem('bjh_user_email'); } catch (e) {}
            if (email) return email;

            // 2. Session Storage
            try { email = sessionStorage.getItem('bjh_user_email'); } catch (e) {}
            if (email) return email;

            // 3. Parent Local Storage (Same Origin only)
            try { 
                if (window.parent && window.parent !== window) {
                    email = window.parent.localStorage.getItem('bjh_user_email');
                }
            } catch (e) { console.warn('Parent access blocked (CORS):', e); }
            if (email) return email;

            // 4. Top Local Storage (Same Origin only)
            try { 
                if (window.top && window.top !== window) {
                    email = window.top.localStorage.getItem('bjh_user_email');
                }
            } catch (e) { console.warn('Top access blocked (CORS):', e); }
            if (email) return email;

            // 5. URL Query Parameters (?email=...)
            try {
                const params = new URLSearchParams(window.location.search);
                email = params.get('email') || params.get('user_email') || params.get('bjh_user_email');
            } catch(e) {}
            
            return email;
        }

        const handleManualLogin = (email) => {
            if (email && email.includes('@')) {
                localStorage.setItem('bjh_user_email', email);
                setUserEmail(email);
                setLoading(true); // Retrigger fetch
            }
        };

        // Fetch Data
        useEffect(() => {
            const fetchData = async () => {
                const email = attemptGetUserEmail();
                setUserEmail(email);

                if (!email) {
                    setLoading(false);
                    return;
                }

                try {
                    const response = await fetch('https://app.base44.com/api/apps/692c05fe1de36b9c6fba5b7e/entities/Download', {
                        headers: {
                            'api_key': '1811ad3b42354132a6d87dc34b7ed2ec',
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) throw new Error('Failed to fetch data');

                    const allDownloads = await response.json();
                    
                    // Filter logic
                    const myApps = allDownloads.filter(d => d.user_email === email);
                    setApps(myApps);
                } catch (err) {
                    console.error(err);
                    setError('Failed to load your applications. Please try again later.');
                } finally {
                    setTimeout(() => setLoading(false), 500);
                }
            };

            fetchData();
        }, [userEmail]); // Re-run if userEmail is set manually

        const filteredApps = apps.filter(app => 
            (app.app_name || '').toLowerCase().includes(search.toLowerCase())
        );

        // -- Rendering States --

        // 1. Not Logged In
        if (!loading && !userEmail) {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden bg-slate-50 dark:bg-[#0f172a] transition-colors duration-300">
                     {/* Toggle in absolute corner for this screen */}
                     <div className="absolute top-4 right-4 z-50">
                        <ThemeToggle theme={theme} toggleTheme={toggleTheme} />
                     </div>

                     {/* Background Gradient */}
                     <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-slate-100 via-white to-slate-100 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 z-0"></div>
                     <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500/10 dark:bg-blue-500/20 rounded-full blur-3xl z-0 pointer-events-none"></div>

                    <div className="glass-panel p-8 rounded-2xl max-w-md w-full text-center relative z-10 animate-fade-up border-t border-white/50 dark:border-white/10 shadow-2xl shadow-slate-200/50 dark:shadow-black/20">
                        <div className="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl ring-4 ring-white dark:ring-white/5">
                            <Icon name="user-x" size={32} className="text-slate-400 dark:text-slate-500" />
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 dark:text-white mb-2">BJH OS Installed Apps</h2>
                        <div className="my-6">
                            <p className="text-slate-600 dark:text-slate-300 text-lg leading-relaxed">
                                No app is installed. Please login to <a href="https://bjh-os-apps-market.base44.app" target="_blank" className="font-semibold text-blue-600 dark:text-blue-400 hover:underline hover:text-blue-700 dark:hover:text-blue-300 transition-colors">BJH OS apps market</a> to install apps.
                            </p>
                        </div>
                        
                        <ManualLogin onLogin={handleManualLogin} />
                    </div>
                </div>
            );
        }

        return (
            <div className="min-h-screen relative selection:bg-blue-500/30">
                {/* Ambient Background Effects */}
                <div className="fixed inset-0 z-0 pointer-events-none overflow-hidden">
                    <div className="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-purple-200/30 dark:bg-purple-900/20 rounded-full blur-[120px]"></div>
                    <div className="absolute top-[20%] right-[10%] w-[30%] h-[30%] bg-blue-200/30 dark:bg-blue-900/20 rounded-full blur-[100px]"></div>
                    <div className="absolute bottom-[10%] left-[20%] w-[40%] h-[40%] bg-emerald-100/40 dark:bg-emerald-900/10 rounded-full blur-[120px]"></div>
                </div>

                <div className="relative z-10 pb-20">
                    <Header email={userEmail} count={filteredApps.length} onSearch={setSearch} theme={theme} toggleTheme={toggleTheme} />

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        
                        {error && (
                            <div className="bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/20 text-rose-700 dark:text-rose-200 p-4 rounded-xl mb-8 flex items-center gap-3">
                                <Icon name="alert-circle" size={20} />
                                {error}
                            </div>
                        )}

                        {loading ? (
                            <LoadingSkeleton />
                        ) : filteredApps.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredApps.map((app, index) => (
                                    <AppCard key={index} app={app} delay={index * 100} />
                                ))}
                            </div>
                        ) : (
                            <EmptyState 
                                message={
                                    search 
                                        ? "No apps match your search." 
                                        : (
                                            <>
                                                You haven't installed any apps yet.
                                                <br />
                                                <a 
                                                    href="https://bjh-os-apps-market.base44.app" 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="inline-flex items-center gap-1 mt-3 text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 font-medium transition-colors"
                                                >
                                                    Go to BJH OS Apps Market to install apps and games
                                                    <Icon name="external-link" size={14} className="ml-1" />
                                                </a>
                                            </>
                                        )
                                } 
                                icon={search ? "search-x" : "package-open"}
                            />
                        )}

                    </main>
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainApp />);

</script>

</body>
</html>
