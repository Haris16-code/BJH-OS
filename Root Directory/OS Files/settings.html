<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJH OS Settings</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f3f3f3;
    --card: #ffffff;
    --accent: #0078d4;
    --text: #111;
    --muted: #666;
    --border: #ddd;
  }

  body {
    margin: 0;
    font-family: 'Poppins', Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  h1 {
    font-weight: 600;
    margin-bottom: 20px;
    font-size: 28px;
  }

  h2.section-title {
    font-size: 16px;
    color: var(--accent);
    margin-top: 30px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
    margin-top: 10px;
  }

  .card {
    background: var(--card);
    border-radius: 8px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
  }

  .card img {
    width: 48px;
    height: 48px;
    margin-bottom: 10px;
  }

  .card span {
    display: block;
    font-weight: 500;
    font-size: 14px;
    color: var(--text);
  }

  #backButton {
    background-color: #4CAF50;
    color: white;
    padding: 10px 18px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    border-radius: 6px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="container">
  <button id="backButton">◀ Go Back</button>
  <h1>Settings</h1>

  <!-- DEVICE Section -->
  <h2 class="section-title">DEVICE</h2>
  <div class="settings-grid">
    <div class="card" onclick="location.href='font.html'">
      <img src="ICONS/font icon.png" alt="Fonts">
      <span>Fonts</span>
    </div>
    <div class="card" onclick="location.href='brightness.html'">
      <img src="ICONS/brightness icon.png" alt="Brightness">
      <span>Screen Brightness</span>
    </div>
    <div class="card" onclick="location.href='audio control.html'">
      <img src="ICONS/sound icon.png" alt="Sound">
      <span>Sound</span>
    </div>
    <div class="card" onclick="location.href='Battery status.html'">
      <img src="ICONS/battery icon.png" alt="Battery">
      <span>Battery</span>
    </div>
    <div class="card" onclick="location.href='https://bjh-os.blogspot.com/p/wallpaper.html'">
      <img src="ICONS/wallpaper icon.png" alt="Wallpaper">
      <span>Wallpaper</span>
    </div>
  </div>

  <!-- PERSONAL Section -->
  <h2 class="section-title">PERSONAL</h2>
  <div class="settings-grid">
    <div class="card" onclick="location.href='password.html'">
      <img src="ICONS/password icon.png" alt="BJH OS Password">
      <span>BJH OS Password</span>
    </div>
    <div class="card" onclick="location.href='location.html'">
      <img src="ICONS/location icon.png" alt="Location">
      <span>Location</span>
    </div>
    <div class="card" onclick="location.href='bjh-os-antivirus.html'">
      <img src="ICONS/bjh-os-antivirus.png" alt="BJH OS Antivirus">
      <span>BJH OS Antivirus</span>
    </div>
  </div>

  <!-- ACCOUNTS Section -->
  <h2 class="section-title">ACCOUNTS</h2>
  <div class="settings-grid">
    <div class="card" onclick="window.open('https://myaccount.google.com')">
      <img src="ICONS/google icon.png" alt="Google">
      <span>Google</span>
    </div>
    <div class="card" onclick="window.open('https://www.whatsapp.com/')">
      <img src="ICONS/whatsapp icon.png" alt="WhatsApp">
      <span>WhatsApp</span>
    </div>
    <div class="card" onclick="location.href='add account.html'">
      <img src="ICONS/add icon.png" alt="Add Account">
      <span>Add Account</span>
    </div>
  </div>

  <!-- SYSTEM Section -->
  <h2 class="section-title">SYSTEM</h2>
  <div class="settings-grid">
    <div class="card" onclick="location.href='software update.html'">
      <img src="ICONS/system update icon.png" alt="System Updates">
      <span>System Updates</span>
    </div>
    <div class="card" onclick="location.href='about device.html'">
      <img src="ICONS/about icon.png" alt="About Device">
      <span>About Device</span>
    </div>
  </div>

</div>

<script>
  document.getElementById("backButton").addEventListener("click", function() {
    window.history.back();
  });
</script>

</body>
</html>
